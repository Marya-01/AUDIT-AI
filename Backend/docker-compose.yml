services:
  db:
    image: postgres:16
    container_name: audit-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: audit_ai
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit_password
    ports:
      - "5432:5432"
    volumes:
      - audit_ai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_user -d audit_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  audit_ai_pgdata:
